<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ctx{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc;
          --accent:#2d5bd7; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --fg:#ecebe6; --muted:#a3a29b; --line:#33332f;
            --accent:#7a9cff; --accent-fg:#0d0d0c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--muted); }
  .btn { display:block; width:100%; padding:10px 14px; margin:0 0 10px; border-radius:8px;
         border:1px solid var(--line); background:var(--card); color:var(--fg);
         font:inherit; text-align:center; text-decoration:none; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .row { display:flex; gap:10px; } .row .btn { margin:0; }
  input { width:100%; padding:9px 12px; margin:0 0 10px; border-radius:8px;
          border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  .muted { font-size:13px; color:var(--muted); }
  hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
  .brand { font-weight:600; letter-spacing:.02em; margin-bottom:18px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">ctx</div>
  {% block body %}{% endblock %}
</main>
</body>
</html>
