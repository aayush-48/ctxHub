[project]
name = "ctx-server"
version = "0.1.0"
description = "Git-style version control for LLM conversation task state: server (REST API + MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "mcp>=1.20",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tiktoken>=0.7",
    "google-genai>=1.0",
    "google-cloud-storage>=2.18",
    "google-cloud-tasks>=2.16",
    "google-auth>=2.30",
    "anthropic[vertex]>=0.40",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-gcp-trace>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
    "opentelemetry-instrumentation-httpx>=0.47b0",
    "numpy>=1.26",
]

[project.optional-dependencies]
nli = ["sentence-transformers>=3.0"]
local-embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_server"]
