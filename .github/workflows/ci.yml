name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
      - run: uv sync --python 3.12 --frozen
      - name: Lint
        run: uv run ruff check server cli evals
      # Testcontainers starts Postgres + pgvector on the runner's Docker.
      - name: Server tests (pipeline, merge, render, OAuth, MCP over HTTP)
        run: uv run pytest server/tests -q
      - name: CLI tests (against a live server process)
        run: uv run pytest cli/tests -q
      - name: Evals (offline providers) with quality gates
        run: >
          uv run python -m evals.run --suites pipeline,merge --n 40 --out evals/results/ci.json
          --fail-under pipeline.full.state_accuracy=0.85
          --fail-under merge.conflict_recall=0.95
          --fail-under merge.auto_merge_correctness=0.9
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/ci.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ctx-server:ci .
