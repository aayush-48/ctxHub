name: Deploy

# Builds the image, pushes it to Artifact Registry and rolls it out to Cloud Run.
# Authenticates with Workload Identity Federation (no service-account keys).
# Repository variables (Settings > Secrets and variables > Actions > Variables), from
# `terraform output`: GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOY_SA.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ctx/ctx-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy ctx --image "$IMAGE" --region ${{ vars.GCP_REGION }}
          --project ${{ vars.GCP_PROJECT_ID }} --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ctx --region ${{ vars.GCP_REGION }} \
                --project ${{ vars.GCP_PROJECT_ID }} --format='value(status.url)')
          curl -fsS "$URL/health"
          curl -fsS "$URL/.well-known/oauth-authorization-server" > /dev/null
