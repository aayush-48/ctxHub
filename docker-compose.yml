# Local stack: Postgres + pgvector and the ctx server with offline fake AI providers and the
# development sign-in. Open http://localhost:8080 after `docker compose up --build`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ctx
      POSTGRES_PASSWORD: ctx
      POSTGRES_DB: ctx
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctx"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      CTX_ENV: dev
      CTX_DATABASE_URL: postgresql+asyncpg://ctx:ctx@db:5432/ctx
      CTX_PUBLIC_BASE_URL: http://localhost:8080
      CTX_DEV_LOGIN: "true"
      CTX_EMBEDDING_PROVIDER: ${CTX_EMBEDDING_PROVIDER:-fake}
      CTX_ARBITER_PROVIDER: ${CTX_ARBITER_PROVIDER:-fake}
      CTX_GEMINI_API_KEY: ${CTX_GEMINI_API_KEY:-}
      CTX_TASKS_PROVIDER: inline
      CTX_STORAGE_PROVIDER: db

volumes:
  pgdata:
