[project]
name = "ctx-cli"
version = "0.1.0"
description = "Command-line client for ctx: git-style version control for LLM context"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
ctx = "ctx_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx_cli"]
